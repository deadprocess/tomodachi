name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach the zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Tomodachi.slnx -c Release

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/publish.ps1

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tomodachi-*.zip
          generate_release_notes: true
